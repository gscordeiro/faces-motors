# Datasource H2 (banco em memória, criado automaticamente na inicialização)
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:facesmotors;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=

# Hibernate ORM
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.second-level-caching-enabled=true

# H2 Console - disponível em http://localhost:8082 ao iniciar a aplicação
# JDBC URL para conectar no console: jdbc:h2:mem:facesmotors
# Usuário: sa  |  Senha: (vazia)
